<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0000ff">
<title>A Designer at the End of the Day — Vent Here</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cursor-glow" id="cursorGlow"></div>

<!-- Gradiente azul fixo no topo — faz a nav aparecer sobre o fundo branco -->
<div class="nav-gradient"></div>

<nav>
  <a href="index.html" class="active">VENT HERE</a>
  <a href="project.html">PROJECT</a>
</nav>
<div id="bubble-layer"></div>
<div class="ui-layer">
  <header>
    <video class="header-img" autoplay loop muted playsinline style="position:fixed;bottom:0;right:0;width:clamp(120px,20vw,220px);height:auto;margin:10px;z-index:15;pointer-events:none;">
   <source src="Comp 1_H.265.mp4" type='video/mp4;codecs=hvc1'>
       <source src="Comp 1_VP9.webm" type="video/webm; codecs=vp9">
    </video>
    <svg class="title-svg" viewBox="0 0 1800 460" xmlns="http://www.w3.org/2000/svg" id="main-title-svg">
      <!-- stroke amarelo por trás -->
      <text x="900" y="200" text-anchor="middle" class="title-text-shadow">DEAR DESIGNER,</text>
      <text x="900" y="270" text-anchor="middle" class="title-text-shadow">HOW DO YOU FEEL</text>
      <text x="900" y="340" text-anchor="middle" class="title-text-shadow">AT THE END </text>
      <text x="900" y="410" text-anchor="middle" class="title-text-shadow">OF THE DAY?</text>
      <!-- texto principal por cima -->
      <text x="900" y="200" text-anchor="middle" class="title-text">DEAR DESIGNER,</text>
      <text x="900" y="270" text-anchor="middle" class="title-text">HOW DO YOU FEEL</text>
      <text x="900" y="340" text-anchor="middle" class="title-text">AT THE END </text>
      <text x="900" y="410" text-anchor="middle" class="title-text">OF THE DAY?</text>
    </svg>
    <script>
    (function() {
      var svg = document.getElementById('main-title-svg');
      function adaptSVG() {
        if (window.innerWidth <= 600) {
          /* Zoom: centramos num subconjunto do viewBox para o texto ficar grande */
          svg.setAttribute('viewBox', '300 120 1200 320');
        } else {
          svg.setAttribute('viewBox', '0 0 1800 460');
        }
      }
      adaptSVG();
      window.addEventListener('resize', adaptSVG);
    })();
    </script>
  </header>
  <div class="form-wrap">
    <textarea id="msg-input" placeholder="Write your sorrows here..." rows="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="form-footer">
      <button class="launch-btn" onclick="launch()">Release ↑</button>
    </div>
  </div>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
